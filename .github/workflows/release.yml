name: release

# Builds the Windows x64 binaries and publishes them as a release.
#
#   * push a tag:      git tag v1.1.2 && git push origin v1.1.2
#   * or run it by hand: Actions -> release -> Run workflow (the tag defaults to v1.1.0)
#
# The job mirrors a local build: Slint C++ (prebuilt, installed silently), the three
# vcpkg ports, then .\build.ps1. The release archive is the build output directory
# plus the licence and the two READMEs.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish under"
        required: false
        default: "v1.1.2"

permissions:
  contents: write

env:
  SLINT_VERSION: "1.13.1"
  SLINT_DIR: "C:\\slint"

jobs:
  windows-x64:
    name: Windows x64
    # Pinned on purpose: windows-latest currently ships Visual Studio 2026, and the
    # project's generator is "Visual Studio 17 2022".
    runs-on: windows-2022

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Slint C++ ${{ env.SLINT_VERSION }}
        shell: pwsh
        run: |
          $url = "https://github.com/slint-ui/slint/releases/download/v$env:SLINT_VERSION/Slint-cpp-$env:SLINT_VERSION-win64-MSVC-AMD64.exe"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile slint-installer.exe -UseBasicParsing
          # NSIS: /S is silent, /D= must be last and unquoted
          $process = Start-Process -FilePath .\slint-installer.exe -ArgumentList "/S", "/D=$env:SLINT_DIR" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Slint installer exited with $($process.ExitCode)" }
          if (-not (Test-Path "$env:SLINT_DIR\lib\cmake\Slint\SlintConfig.cmake")) {
            throw "Slint was not installed into $env:SLINT_DIR"
          }
          Write-Host "Slint ready in $env:SLINT_DIR"

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          Write-Host "vcpkg: $vcpkg"
          & "$vcpkg\vcpkg.exe" install zlib:x64-windows libwebp:x64-windows zstd:x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }
          # build.ps1 reads VCPKG_ROOT; ${{ env.X }} cannot see the runner's variables
          "VCPKG_ROOT=$vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          .\build.ps1 -Clean
          if (-not (Test-Path "build\Release\ApkInfo.exe")) { throw "the build produced no ApkInfo.exe" }

      - name: Smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "build\Release\apkinfo-cli.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }

          # The CLI exits non-zero for input it cannot read; capture the exit code
          # explicitly so it never becomes this step's exit code.
          function Invoke-Cli([string]$target) {
              $stdout = "$env:RUNNER_TEMP\cli-out.txt"
              $stderr = "$env:RUNNER_TEMP\cli-err.txt"
              & $exe $target > $stdout 2> $stderr
              $code = $LASTEXITCODE
              $text = (Get-Content $stdout -Raw -ErrorAction SilentlyContinue) +
                      (Get-Content $stderr -Raw -ErrorAction SilentlyContinue)
              Write-Host $text
              return @{ Output = $text; Code = $code }
          }

          # a synthetic Alpine v2 package must be recognised
          Remove-Item smoke.apk -ErrorAction SilentlyContinue
          python tests\make_smoke_package.py smoke.apk
          $pack = Invoke-Cli "smoke.apk"
          if ($pack.Code -ne 0) { throw "the CLI exited $($pack.Code) on a valid package" }
          if ($pack.Output -notmatch "Alpine package") { throw "the package was not detected as Alpine" }
          if ($pack.Output -notmatch "smoke-test") { throw "the package name was not read" }
          if ($pack.Output -notmatch "1\.0\.0-r0") { throw "the version was not read" }

          # a plain file must be rejected
          $plain = Invoke-Cli "README.md"
          if ($plain.Output -notmatch "unrecognised") { throw "a plain file was not rejected" }

          # the association scripts must run from a flat folder (they land in the release)
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\Register-FileAssociations.ps1 -DryRun -Exe "build\Release\ApkInfo.exe"
          if ($LASTEXITCODE -ne 0) { throw "Register-FileAssociations.ps1 -DryRun failed" }
          & powershell -NoProfile -ExecutionPolicy Bypass -File .\Unregister-FileAssociations.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "Unregister-FileAssociations.ps1 -DryRun failed" }

          # the viewer binary and its runtime must be there
          foreach ($file in @("ApkInfo.exe", "slint_cpp.dll", "libwebp.dll", "zstd.dll")) {
              if (-not (Test-Path "build\Release\$file")) { throw "missing build/Release/$file" }
          }
          Write-Host "smoke test passed"
          exit 0

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}"
          if (-not $version) { $version = "v1.1.2" }
          $archiveName = "APK-Info-Revived-$version-win64"
          $stage = Join-Path "dist" $archiveName
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "build\Release\ApkInfo.exe" $stage
          Copy-Item "build\Release\apkinfo-cli.exe" $stage
          Copy-Item "build\Release\*.dll" $stage
          Copy-Item "LICENSE", "README.md", "README.en.md" $stage
          # the association scripts belong to the release: they resolve ApkInfo.exe and the
          # icons next to themselves, so the extracted folder can register itself
          Copy-Item "Register-FileAssociations.ps1", "Unregister-FileAssociations.ps1" $stage
          New-Item -ItemType Directory -Force -Path "$stage\icons" | Out-Null
          foreach ($iconName in @("app", "apk", "apks", "android", "alpine")) {
              Copy-Item "assets\icons\$iconName.ico" "$stage\icons"
          }
          Compress-Archive -Path "$stage\*" -DestinationPath "dist/$archiveName.zip" -CompressionLevel Optimal
          Get-ChildItem dist | Select-Object Name, Length
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARCHIVE=dist/$archiveName.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload the build artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Info-Revived-win64
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: APK Info — Revived ${{ env.VERSION }}
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
          body: |
            Windows x64 build of APK Info — Revived.

            `ApkInfo.exe` is the viewer, `apkinfo-cli.exe` dumps everything the parsers
            found (for scripts and regression checks). The DLLs beside them are the
            Slint runtime and the vcpkg libraries — keep the folder together.

            Licensed under GPL-3.0-only; see `LICENSE`. The binaries link Slint's GPLv3
            build, so they are distributed under GPL-3.0 as a whole.
